plugins {
    id 'com.android.application'
}

android {
    namespace 'org.slfa.league'
    compileSdk 34

    defaultConfig {
        applicationId 'org.slfa.league'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
