name: Build SLFA League APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Publish APK to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk slfa-league.apk
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "SLFA League app (Android)" --notes "Install this APK on an Android phone to get the SLFA League app." --target "$GITHUB_SHA"
          gh release upload apk-latest slfa-league.apk --clobber
