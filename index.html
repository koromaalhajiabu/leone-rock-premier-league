<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLFA Central Operations Suite | Master Developer Governance</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Official Enterprise Supabase JS Library safely via UMD CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-body: #f4f6f8;
            --bg-card: #ffffff;
            --text-main: #081c15;
            --text-muted: #64748b;
            --primary: #1b4332;
            --primary-light: #2d6a4f;
            --accent: #ffb703;
            --border: #e9ecef;
            --danger: #d90429;
            --success: #52b788;
            --radius: 12px;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #14b8a6;
            --primary-light: #0d9488;
            --border: #334155;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        [data-theme="midnight-emerald"] {
            --bg-body: #0b132b;
            --bg-card: #1c2541;
            --text-main: #ffffff;
            --text-muted: #5bc0be;
            --primary: #1b4332;
            --primary-light: #52b788;
            --border: #3a506b;
            --shadow: 0 4px 12px rgba(0,242,254,0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); transition: all 0.25s ease; line-height: 1.6; }
        .layout-container { max-width: 1400px; margin: 0 auto; padding: 0 1.5rem; display: grid; grid-template-columns: 1fr; gap: 2rem; margin-top: 2rem; }
        
        @media (min-width: 1024px) { .layout-container { grid-template-columns: 3fr 1fr; } }

        .broadcast-banner { background: linear-gradient(135deg, var(--primary), #081c15); color: white; padding: 0.6rem 1.5rem; text-align: center; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; border-bottom: 3px solid var(--accent); }
        .close-banner { background: rgba(255,255,255,0.1); border: none; font-weight: bold; color: white; cursor: pointer; padding: 0.2rem 0.5rem; border-radius: 4px; }

        header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 1.5rem 2rem; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .brand h1 { font-size: 1.5rem; font-weight: 800; color: var(--primary-light); letter-spacing: -0.02em; }
        .brand p { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

        .premium-card { background: var(--bg-card); border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; border-top: 4px solid var(--primary-light); position: relative; overflow: hidden; }
        .card-header-toggle { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        .card-header-toggle h3 { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }

        .security-lockout { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; padding: 1rem; text-align: center; }
        [data-theme="dark"] .security-lockout { background: rgba(30, 41, 59, 0.95); }
        [data-theme="midnight-emerald"] .security-lockout { background: rgba(28, 37, 65, 0.95); }
        .security-lockout p { font-size: 0.9rem; font-weight: 700; color: var(--danger); }

        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; margin-bottom: 1.25rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
        label { font-weight: 600; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
        
        input, select { padding: 0.65rem 0.85rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.875rem; background: var(--bg-body); color: var(--text-main); outline: none; transition: border 0.2s; }
        input:focus, select:focus { border-color: var(--primary-light); }
        input[type="file"] { background: transparent; border: 1px dashed var(--border); padding: 0.5rem; border-radius: 6px; }

        button { padding: 0.65rem 1.25rem; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.875rem; background: var(--primary-light); color: white; transition: all 0.2s ease; width: fit-content; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-accent { background: var(--accent); color: #081c15; }
        .btn-danger { background: var(--danger); color: white; }

        table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.9rem; }
        th { padding: 0.75rem 1rem; color: var(--text-muted); font-weight: 700; border-bottom: 2px solid var(--border); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; background: rgba(0,0,0,0.01); }
        td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
        
        .badge { padding: 0.25rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .badge-live { background: var(--danger); color: white; animation: pulse 2s infinite; }
        .badge-secure { background: rgba(82, 183, 136, 0.15); color: var(--success); }

        /* Media Thumbnail & Document Link CSS definitions */
        .asset-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #cbd5e1; border: 2px solid var(--primary-light); display: block; }
        .asset-placeholder { width: 42px; height: 42px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #64748b; }
        .doc-link-pill { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.6rem; background: #f1f5f9; border: 1px solid #cbd5e1; color: #334155; border-radius: 6px; font-size: 0.75rem; font-weight: 600; text-decoration: none; }
        .doc-link-pill:hover { background: #e2e8f0; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        footer { background: #081c15; color: #a8dadc; text-align: center; padding: 2rem; margin-top: 5rem; font-size: 0.85rem; font-weight: 500; border-top: 3px solid var(--accent); }
    </style>
</head>
<body data-theme="light">

    <div class="broadcast-banner" id="globalBroadcast">
        <span id="bannerText">📢 SLFA Central Registry System Node Active. Deployment Mode Operational.</span>
        <button class="close-banner" onclick="toggleBroadcast(false)">✕</button>
    </div>

    <header>
        <div class="header-container">
            <div class="brand">
                <h1>SLFA Central Operations Suite</h1>
                <p>Universal Operational Framework Ledger</p>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <label for="sessionRole" style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted);">ACTIVE SYSTEM PRIVILEGE:</label>
                <select id="sessionRole" onchange="applySecurityMatrix()" style="padding: 0.4rem; font-weight: 600;">
                    <option value="Viewer">Public View (Read-Only)</option>
                    <option value="Club Admin">Club Coach / Manager Workspace</option>
                    <option value="Referee">Match Referee Profile</option>
                    <option value="Master Developer Access">Master Access Controller</option>
                </select>
            </div>
        </div>
    </header>

    <div class="layout-container">
        <main>
            <!-- 1. Universal Cloud Configuration Dashboard -->
            <div class="premium-card" style="border-top-color: var(--accent);">
                <div class="card-header-toggle">
                    <h3 style="color: var(--primary-light);">🔌 Supabase Cloud Infrastructure Connectivity</h3>
                </div>
                <div style="background: var(--bg-body); padding: 1.25rem; border-radius: 8px;">
                    <div class="grid-2">
                        <div class="form-group"><label>Supabase Target Endpoint URL</label><input type="text" id="sbUrl" placeholder="https://supabase.co"></div>
                        <div class="form-group"><label>Project Public Token (anon Key)</label><input type="password" id="sbKey" placeholder="Paste credential token hash..."></div>
                    </div>
                    <div style="margin-top: 1rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
                        <button type="button" class="btn-accent" id="connectClusterBtn">Link Production Schema</button>
                        <span id="syncNotice" style="font-size: 0.85rem; font-weight: 600; color: var(--success);"></span>
                    </div>
                </div>

                <div class="grid-2" style="margin-top: 1.5rem;">
